/**:
  ros__parameters:
    debug: true
    target_frame: odom
    max_armor_distance: 10.0

    ekf:
      sigma2_q_x: 10.0
      sigma2_q_y: 10.0
      sigma2_q_z: 1.0
      sigma2_q_yaw: 30.0
      sigma2_q_r: 100.0
      sigma2_q_delta_r: 5.0
      sigma2_q_dz: 5.0

      r_azimuth: 0.005
      r_elevation: 0.005
      r_distance: 0.02
      r_armor_yaw: 0.02

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 1.0

      tracking_thres: 2
      lost_time_thres: 1.0
    
    solver:
      yaw_offset: 0.0
      pitch_offset: 0.0
      high_yaw_pitch_compensation_threshold: 6.0
      high_yaw_pitch_compensation_reference: 10.0
      max_high_yaw_pitch_offset: 1.2

      # 第二道开火闸门：实测云台是否真的对准装甲板。
      # 规划器的 plan.fire 只检查"规划是否仍在跟随参考"，看不到下位机滞后。
      shooting_range_height: 0.135
      fire_margin: 0.8
      min_fire_tolerance: 1.0
      max_fire_tolerance: 4.0

      bullet_speed: 23.0

      # 轨迹规划器（移植自 sp_vision_25，参数取自其步兵实机配置）
      planner:
        fire_thresh: 0.003
        max_yaw_acc: 50.0
        Q_yaw: [9e6, 0.0]
        R_yaw: 1.0
        max_pitch_acc: 100.0
        Q_pitch: [9e6, 0.0]
        R_pitch: 1.0
        decision_speed: 8.0
        high_speed_delay_time: 0.030
        low_speed_delay_time: 0.015
