/**:
  ros__parameters:
    debug: true
    target_frame: odom
    max_armor_distance: 10.0

    ekf:
      sigma2_q_x: 10.0
      sigma2_q_y: 10.0
      sigma2_q_z: 1.0
      sigma2_q_yaw: 30.0
      sigma2_q_r: 100.0
      sigma2_q_delta_r: 5.0
      sigma2_q_dz: 5.0

      r_azimuth: 0.005
      r_elevation: 0.005
      r_distance: 0.02
      r_armor_yaw: 0.02

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 1.0

      tracking_thres: 2
      lost_time_thres: 1.0
    
    solver:
      prediction_delay: 0.045
      controller_delay: 0.025
      max_tracking_v_yaw: 4.5 # 近距离高速旋转时进入中心跟踪
      center_tracking_distance: 1.5
      min_switching_v_yaw: 1.0 # 低速最近板锁定与高速方向选板的切换阈值
      coming_angle: 55.0
      leaving_angle: 20.0
      yaw_offset: 0.0
      pitch_offset: 0.0
      high_yaw_pitch_compensation_threshold: 6.0
      high_yaw_pitch_compensation_reference: 10.0
      max_high_yaw_pitch_offset: 1.2
      fire_margin: 0.8
      min_fire_tolerance: 1.0
      max_fire_tolerance: 4.0
      bullet_speed: 23.0
      compensator_type: "ideal" # ideal 或 resistance
      gravity: 10.0
      resistance: 0.092
      iteration_times: 50
      mpc:
        enabled: true
        dt: 0.01
        horizon: 40
        preview_steps: 0
        actuator_delay: 0.0
        position_weight: 40.0
        velocity_weight: 4.0
        acceleration_weight: 0.2
        jerk_weight: 0.05
        terminal_weight: 80.0
        max_velocity: 12.0
        max_acceleration: 50.0
        max_jerk: 500.0
        step_size: 0.002
        max_iterations: 12
